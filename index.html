<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="256x256" href="/icon.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="1024x1024" href="/icon-1024.png">
  <title>Choyeon Note</title>
</head>
<body>
  <div id="app"></div>
  <script>
    // 模块脚本求值顺序在打包后不保证：env.js 可能在桥接模块之前读取
    // window.electronAPI。这里在经典脚本阶段先放一个占位对象，让 IS_ELECTRON
    // 在 Tauri 环境中恒为 true；完整 API 仍由 tauriBridge.js 在挂载前注入。
    if (window.isTauri || (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke)) {
      window.electronAPI = window.electronAPI || {}
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
